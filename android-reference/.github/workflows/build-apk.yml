name: Build e publicar APK

# Compila o APK automaticamente no GitHub e publica numa Release
# com link de download público. Basta enviar a pasta android-reference
# para um repositório GitHub e criar uma tag (ex.: v1.0.0).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-reference
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (release)
        run: ./gradlew assembleRelease

      - name: Renomear APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/kiosk-agent.apk

      - name: Enviar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-agent-apk
          path: android-reference/out/kiosk-agent.apk

      - name: Publicar Release com link de download
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android-reference/out/kiosk-agent.apk
          name: Kiosk Agent ${{ github.ref_name }}
          generate_release_notes: true
